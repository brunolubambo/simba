<style>
:root{
  --bg:#020812; --holo:#38c8ff; --holo-2:#0b5cff; --holo-dim:rgba(56,200,255,.35); --holo-faint:rgba(56,200,255,.12);
  --text:#d8f6ff; --muted:#7fb3c7; --amber:#ffb547; --ok:#3dffa8; --bad:#ff5d6c;
  --glow:0 0 6px rgba(94,231,255,.8),0 0 18px rgba(31,182,255,.45);
}
*{box-sizing:border-box}
html,body{height:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.45 Rajdhani,system-ui,sans-serif;overflow:hidden;
  display:flex;flex-direction:column;height:100dvh;
  background-image:radial-gradient(ellipse at 50% 40%,#041a33,transparent 58%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 7px)}
#grain{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.04;
  background-image:radial-gradient(rgba(255,255,255,.6) .6px,transparent .7px);background-size:3px 3px}
.label{font-family:Orbitron,sans-serif;letter-spacing:.18em;text-transform:uppercase;font-size:10px;color:var(--muted)}

#stage{flex:1;position:relative;min-height:0}
#core{position:absolute;inset:0;width:100%;height:100%;display:block}
#state{position:absolute;left:0;right:0;bottom:8px;text-align:center;z-index:2}
#state .label{color:#bff3ff;letter-spacing:.22em}
#hudMarks{position:absolute;inset:0;pointer-events:none;z-index:2}
#hudMarks span{position:absolute;top:max(12px,env(safe-area-inset-top));font-family:Orbitron,sans-serif;font-size:9px;letter-spacing:.16em;color:rgba(191,243,255,.62);text-transform:uppercase}
#hudHealth{left:16px}
#hudLink{right:16px}
#hudLink.off{opacity:.35}
#rotinas{position:absolute;right:16px;top:max(36px,calc(env(safe-area-inset-top) + 22px));z-index:2;
  text-align:right;max-width:min(240px,46vw);pointer-events:none}
#rotinas[hidden]{display:none}
#rotinas .label{display:block;margin-bottom:4px}
#rotinas div{font-family:Orbitron,sans-serif;font-size:9px;letter-spacing:.06em;color:rgba(191,243,255,.75);
  text-transform:uppercase;line-height:1.45}
#rotinas .off{opacity:.45}

#caption{position:absolute;left:0;right:0;bottom:34px;z-index:3;padding:22px 18px 2px;text-align:center;pointer-events:none;
  background:linear-gradient(transparent,rgba(2,8,18,.82) 36%)}
#heard{color:var(--muted);font-size:15px}
#heard:empty{display:none}
#said{max-height:min(18vh,7.5rem);overflow:auto;white-space:pre-wrap;font-size:16px;padding:2px 6px 6px;pointer-events:auto}
#said:empty{display:none}

#alerts{position:fixed;top:max(10px,env(safe-area-inset-top));left:12px;width:min(300px,calc(100vw - 24px));z-index:4;display:flex;flex-direction:column;gap:6px}
.alert{border:1px solid var(--amber);background:rgba(40,26,4,.75);padding:8px 10px;color:#ffe2b0;font-size:15px;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.alert.info{border-color:var(--holo);background:rgba(4,26,40,.75);color:var(--text)}
.alert .label{color:var(--amber);display:block;margin-bottom:2px}
.alert.info .label{color:var(--holo)}
.alert .body{white-space:pre-wrap;max-height:110px;overflow:auto}
.alert .row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.alert button{font:600 14px Rajdhani,sans-serif;letter-spacing:.08em;background:transparent;border:1px solid currentColor;color:inherit;padding:6px 12px;min-height:36px}
.alert input{flex:1;min-width:0;background:rgba(4,20,32,.7);border:1px solid var(--holo-dim);color:var(--text);font:16px Rajdhani,sans-serif;padding:8px}

#grid{display:none}
.ag{border:1px solid var(--holo-faint);background:rgba(4,18,30,.5);padding:6px 5px 5px;text-align:center;transition:all .25s;
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.ag .n{font-family:Orbitron,sans-serif;font-size:9px;letter-spacing:.06em;text-transform:uppercase;line-height:1.3;min-height:24px;display:grid;place-items:center}
.ag .s{font-size:9px;letter-spacing:.14em;color:var(--ok);font-family:Orbitron,sans-serif;text-transform:uppercase}
.ag .s::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;margin-right:4px;vertical-align:middle;box-shadow:0 0 6px currentColor}
.ag.on{border-color:var(--holo);background:rgba(31,182,255,.18);box-shadow:inset 0 0 14px rgba(94,231,255,.4)}
.ag.on .s{color:var(--amber)}
.ag.custom{border-style:dashed}
.sep{grid-column:1/-1;margin-top:4px}

footer{display:flex;gap:8px;padding:8px 12px;padding-bottom:max(8px,env(safe-area-inset-bottom));border-top:1px solid var(--holo-faint);background:rgba(1,8,16,.85)}
#input{flex:1;background:rgba(4,20,32,.7);border:1px solid var(--holo-dim);color:var(--text);font:17px Rajdhani,sans-serif;padding:10px 12px;outline:none}
#input:focus{border-color:var(--holo);box-shadow:var(--glow)}
#input::placeholder{color:var(--muted)}

#wake{position:fixed;inset:0;display:none;place-items:center;background:rgba(1,6,13,.9);z-index:5;text-align:center;padding:24px}
#wake.show{display:grid}
#wake p{max-width:300px;color:var(--muted);margin:0 auto}
#wake h2{font-family:Orbitron,sans-serif;letter-spacing:.3em;color:var(--holo);text-shadow:var(--glow);font-weight:500}
#login{display:flex;flex-direction:column;gap:10px;width:min(320px,90vw)}
#login input{background:rgba(4,20,32,.7);border:1px solid var(--holo-dim);color:var(--text);font:17px Rajdhani,sans-serif;padding:12px}
#login button{font:600 14px Orbitron,sans-serif;letter-spacing:.2em;background:rgba(31,182,255,.15);border:1px solid var(--holo);color:var(--holo);padding:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--holo);outline-offset:2px}

<body>
<h1 class="sr">SIMBA, assistente pessoal</h1>
<div id="grain" aria-hidden="true"></div>
<section id="stage">
  <canvas id="core" aria-hidden="true"></canvas>
  <div id="hudMarks" aria-hidden="true"><span id="hudHealth">sistema</span><span id="hudLink" class="off">conexão</span></div>
  <div id="rotinas" hidden aria-label="Rotinas programadas"></div>
  <div id="caption" aria-live="polite">
    <div id="heard"></div>
    <div id="said"></div>
  </div>
  <div id="state" aria-live="polite"><span class="label" id="stateTxt">DIGA “EI, SIMBA”</span></div>
</section>
<div id="alerts" aria-live="assertive"></div>
<div id="grid" aria-label="Agentes"></div>

<footer>
  <label class="sr" for="input">Digite quando não puder falar</label>
  <input id="input" autocomplete="off" enterkeyhint="send" placeholder="Diga “ei, Simba” ou digite aqui">
</footer>
<script type="module" src="hud.js"></script>

<div id="wake" role="dialog" aria-modal="true" aria-labelledby="wakeTitle"><div id="wakeBody"></div></div>

<script>
const $ = s => document.querySelector(s);
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
const store = { get: k => { try { return localStorage.getItem(k) } catch { return null } },
                set: (k, v) => { try { localStorage.setItem(k, v) } catch {} },
                del: k => { try { localStorage.removeItem(k) } catch {} } };

// ---------- token e parâmetros ----------
const qs = new URLSearchParams(location.search);
if (qs.get("token")) store.set("st", qs.get("token"));
const googleMsg = qs.get("google");
if (location.search) history.replaceState(null, "", location.pathname);
let TOKEN = store.get("st") || "";
const DEVICE = /Android|iPhone|iPad/i.test(navigator.userAgent) ? "celular" : "pc";
const T = () => encodeURIComponent(TOKEN);

// ---------- niveis de voz para o holograma (um unico caminho de audio) ----------
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let audioCtx, analyser, mediaSrc, voiceBins, freqBins;
function ensureVoiceTap() {
  // Vazio de propósito. No Windows o <audio> já sai nos alto-falantes; qualquer
  // captura (createMediaElementSource ou captureStream) toca a mesma voz de novo.
}
function simbaLevels() {
  let rms = 0, bass = 0, mid = 0, high = 0;
  const talking = document.body.classList.contains('speaking');
  if (analyser && voiceBins && player.src && !player.paused) {
    try { audioCtx && audioCtx.resume(); } catch {}
    analyser.getByteTimeDomainData(voiceBins);
    let s = 0;
    for (let i = 0; i < voiceBins.length; i++) { const n = (voiceBins[i] - 128) / 128; s += n * n; }
    rms = Math.min(1, Math.sqrt(s / voiceBins.length) * 3.4);
    analyser.getByteFrequencyData(freqBins);
    const n = freqBins.length;
    const avg = (x, y) => { let t = 0, c = 0; for (let i = x; i < y; i++) { t += freqBins[i]; c++; } return c ? t / c / 255 : 0; };
    bass = avg(1, n * 0.08 | 0);
    mid = avg(n * 0.08 | 0, n * 0.28 | 0);
    high = avg(n * 0.28 | 0, n * 0.55 | 0);
  } else if (talking && !reduceMotion) {
    const t = performance.now() / 1000;
    const env = 0.28 + 0.72 * Math.abs(Math.sin(t * 7.2)) * (0.5 + 0.5 * Math.abs(Math.sin(t * 13.1)));
    rms = 0.35 + env * 0.4; bass = rms; mid = rms * 0.75; high = rms * 0.4;
  }
  return { rms, bass, mid, high };
}
window.simbaLevels = simbaLevels;
window.simbaOnline = () => online();

function setState(s, label) {
  document.body.classList.remove("thinking", "speaking", "listening");
  if (s) document.body.classList.add(s);
  const phrases = { listening: "OUVINDO…", thinking: "PENSANDO…", speaking: "FALANDO…" };
  const mode = phrases[s] ? s : "idle";
  $("#stateTxt").textContent = phrases[s] || (label && label !== "online" ? label : "DIGA “EI, SIMBA”");
  window.simbaHud && window.simbaHud.setMode(mode);
}
function animateBars() {}

// ---------- painel de agentes e métricas ----------
let AGENTS = [];
function renderAgents() {
  const g = $("#grid"); g.innerHTML = ""; let last = "";
  for (const a of AGENTS) {
    if (a.grupo !== last) { last = a.grupo; const s = document.createElement("div"); s.className = "label sep"; s.textContent = a.grupo; g.append(s); }
    const d = document.createElement("div"); d.className = "ag" + (a.grupo === "Criados por você" ? " custom" : ""); d.id = "ag-" + a.id; d.title = a.descricao;
    d.innerHTML = `<div class="n"></div><div class="s">online</div>`; d.querySelector(".n").textContent = a.nome; g.append(d);
  }
}
function agentState(id, working, task) {
  const d = document.getElementById("ag-" + id); if (!d) return;
  d.classList.toggle("on", working); d.querySelector(".s").textContent = working ? "ativo" : "online";
  if (working) { d.scrollIntoView({ block: "nearest", behavior: "smooth" }); if (task) d.title = task; }
}
async function loadPanel() {
  try {
    const r = await fetch(`/painel?token=${T()}`); if (!r.ok) return;
    const p = await r.json();
    const ids = p.agents.map(a => a.id).join();
    if (ids !== AGENTS.map(a => a.id).join()) { AGENTS = p.agents; renderAgents(); }
  } catch {}
}

// ---------- fala ----------
let speaking = false, voice = null, convoUntil = 0;
// voz neural do servidor (Antonio); se falhar, usa a voz do próprio celular
const player = new Audio(); let sayId = 0, playingUrl = null, serverVoiceOffUntil = 0;
function unlockAudio() {  // iOS só toca áudio depois de um toque: toca um silêncio para liberar o player
  const AC = window.AudioContext || window.webkitAudioContext;
  if (AC) { try { audioCtx = audioCtx || new AC(); audioCtx.resume(); } catch {} }
  if (playingUrl && !player.paused) return;            // já está falando com a voz do servidor: não interrompe
  try { player.onended = player.onerror = null;
        player.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA="; player.play().catch(() => {}); } catch {}
}
document.addEventListener("pointerdown", unlockAudio, { once: true });
function pickVoice() {
  const vs = speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith("pt"));
  voice = vs.find(v => /br/i.test(v.lang) && /(daniel|antonio|felipe|male)/i.test(v.name)) || vs.find(v => /br/i.test(v.lang)) || vs[0] || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function spoken(t) {
  return t
    .replace(/```[\s\S]*?```/g, " ")
    .replace(/`([^`]+)`/g, "$1")
    .replace(/!\[[^\]]*\]\([^)]+\)/g, " ")
    .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
    .replace(/https?:\/\/\S+/g, " link ")
    .replace(/[\w.+-]+@[\w.-]+\.[a-z]{2,}/gi, " e-mail ")
    .replace(/^#{1,6}\s+/gm, "")
    .replace(/^\s*[-*]\s+/gm, "")
    .replace(/[*_>#|]/g, "")
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, " ")
    .replace(/\s+/g, " ")
    .trim();
}
function doneSpeaking() {
  speaking = false; animateBars(false); convoUntil = Date.now() + 15000; echoUntil = Date.now() + 900;
  setState(null, "online");
  setTimeout(() => { if (!speaking) startListening(); }, 400);
}
function freeUrl() { if (playingUrl) { URL.revokeObjectURL(playingUrl); playingUrl = null; } }
function sayBrowser(t, done) {
  if (!("speechSynthesis" in window)) return done();
  const u = new SpeechSynthesisUtterance(t); u.lang = "pt-BR"; if (voice) u.voice = voice; u.rate = 1.05;
  u.onend = u.onerror = () => done();
  speechSynthesis.speak(u);
  perfPlayedAudio();
}
let sayQueue = [], sayBusy = false, sayGen = 0, playFinish = null, voiced = "", turnOpen = false, playingText = "";
let perfTextAt = 0, perfQueued = false, perfPlayed = false;
let perfSendAt = 0, perfNetMs = 0, perfMine = false, perfSplitLogged = false;
function perfReset() { perfTextAt = 0; perfQueued = false; perfPlayed = false; perfSplitLogged = false; }
function perfSawText() {
  if (perfTextAt) return;
  perfTextAt = performance.now();
  if (!perfMine || perfSplitLogged) return;
  perfSplitLogged = true;
  const total = Math.round(perfTextAt - perfSendAt);
  const rede = Math.round(perfNetMs);
  console.info(`[perf] primeiro texto ${total}ms (rede ${rede}ms, servidor ${Math.max(0, total - rede)}ms)`);
}
function perfQueuedAudio() {
  if (!perfTextAt || perfQueued) return;
  perfQueued = true;
  console.info(`[perf] texto->fila ${Math.round(performance.now() - perfTextAt)}ms`);
}
function perfPlayedAudio() {
  if (!perfTextAt || perfPlayed) return;
  perfPlayed = true;
  console.info(`[perf] texto->áudio ${Math.round(performance.now() - perfTextAt)}ms`);
}
let lastSaid = "", echoUntil = 0, lastHeard = "", lastHeardAt = 0;
function silenceNow() {
  sayGen++; sayQueue = []; sayBusy = false;
  const finish = playFinish; playFinish = null;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  player.onended = player.onerror = null;
  try { player.pause(); } catch {}
  try { player.removeAttribute("src"); player.load(); } catch {}
  freeUrl(); speaking = false;
  if (finish) finish();
}
function say(text) {
  const t = spoken(text);
  if (!t || t === playingText || t === sayQueue[sayQueue.length - 1]) return;
  sayQueue.push(t);
  perfQueuedAudio();
  pumpSay();
}
async function fetchClip(text, gen) {
  try {
    if (!TOKEN || Date.now() <= serverVoiceOffUntil || gen !== sayGen) return null;
    const r = await fetch(`/tts?token=${T()}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
    if (!r.ok || gen !== sayGen) return null;
    const job = (await r.json()).id;
    if (!job || gen !== sayGen) return null;
    const audio = await fetch(`/tts/${job}?token=${T()}`);
    if (!audio.ok || gen !== sayGen) return null;
    const blob = await audio.blob();
    if (!blob.size || gen !== sayGen) return null;
    return URL.createObjectURL(blob);
  } catch { return null; }
}
function playClip(url, text, gen) {
  return new Promise(resolve => {
    if (gen !== sayGen) { if (url) URL.revokeObjectURL(url); return resolve(); }
    let settled = false, heard = false, browser = false;
    const finish = () => {
      if (settled) return;
      settled = true;
      if (playingText === text) playingText = "";
      playFinish = null;
      resolve();
    };
    playFinish = finish;
    playingText = text;
    const fallback = () => {
      if (browser || heard || gen !== sayGen) return;
      browser = true;
      if ("speechSynthesis" in window) speechSynthesis.cancel();
      player.onended = player.onerror = null;
      try { player.pause(); player.removeAttribute("src"); player.load(); } catch {}
      freeUrl();
      sayBrowser(text, finish);
    };
    if (!url) return fallback();
    player.onended = () => { heard = true; playingUrl = null; finish(); };
    player.onerror = () => {
      playingUrl = null;
      if (heard || player.currentTime >= 0.05) { if (player.paused || player.ended) finish(); return; }
      fallback();
    };
    playingUrl = url;
    player.src = url;
    player.play().then(() => { heard = true; perfPlayedAudio(); }).catch(e => {
      if (gen !== sayGen || heard || browser) return;
      if (!(e && e.name === "NotAllowedError")) serverVoiceOffUntil = Date.now() + 5 * 60 * 1000;
      fallback();
    });
  });
}
async function pumpSay() {
  if (sayBusy) return;
  sayBusy = true;
  const gen = sayGen;
  stopListening(); speaking = true; setState("speaking", "falando"); animateBars(true);
  try { audioCtx && audioCtx.resume(); } catch {}
  try {
    let ahead = sayQueue.length ? fetchClip(sayQueue[0], gen) : null;
    while (sayQueue.length && gen === sayGen) {
      const t = sayQueue.shift();
      const url = await ahead;
      if (gen !== sayGen) { if (url) URL.revokeObjectURL(url); break; }
      ahead = sayQueue.length ? fetchClip(sayQueue[0], gen) : null;
      lastSaid = (lastSaid + " " + t).trim().slice(-500);
      await playClip(url, t, gen);
      if (url && url.startsWith("blob:") && playingUrl !== url) URL.revokeObjectURL(url);
    }
  } finally {
    if (gen === sayGen) {
      sayBusy = false;
      if (sayQueue.length) pumpSay();
      else if (!turnOpen) doneSpeaking();
    }
  }
}
function absorbText(chunk) {
  const c = String(chunk || "").trim();
  if (!c) return;
  const plain = s => spoken(shown(s));
  const all = turnText.join("\n\n").trim();
  if (!all) { turnText = [c]; return; }
  const A = plain(all), C = plain(c);
  if (!C || C === A || A.endsWith(C) || A.startsWith(C)) return;
  if (C.startsWith(A)) { turnText = [c]; return; }
  turnText.push(c);
}
function speakNew(flush) {
  const full = spoken(turnText.map(shown).join("\n\n"));
  if (!full || (voiced && !full.startsWith(voiced))) return;
  while (full.length > voiced.length) {
    const fresh = full.slice(voiced.length);
    if (!fresh.trim()) return;
    if (!flush) {
      const m = /[.!?…](?:\s|$)/.exec(fresh);
      if (!m) return;
      const piece = fresh.slice(0, m.index + 1).trim();
      voiced += fresh.slice(0, m.index + m[0].length);
      if (piece) say(piece);
    } else {
      voiced = full;
      let rest = fresh.trim();
      while (rest) {
        let cut = rest.length;
        if (cut > 220) {
          const sp = rest.lastIndexOf(" ", 220);
          cut = sp > 40 ? sp : 220;
        }
        const piece = rest.slice(0, cut).trim();
        rest = rest.slice(cut).trim();
        if (piece) say(piece);
      }
      return;
    }
  }
}

// ---------- escuta contínua enquanto a página está aberta: "ei, Simba" ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, wantListen = true, pendingApproval = null, wakeTimer = 0;
const YES = /^(sim|pode|autorizo|confirmo|confirma|manda|envia|ok|claro|isso|positivo|faca|faz|segue)\b/;
const NO = /^(nao|cancela|negado|nega|para|pare|espera|negativo)\b/;
// pt-BR escreve "Simba" como samba, sinba, zimba. "ei"/"hey" e a vírgula são opcionais.
// "sim" sozinho não entra aqui: continua só na autorização.
const WAKE = /\b(?:(?:ei|hey)[, ]+)?(?:simba|samba|sinba|zimba|cimba|simbah|sim[, ]+ba)\b[\s,.!?:-]*/;
function afterWake(t) {  // frase inteira depois da ativação, ou null se ela não foi dita
  const src = String(t).normalize("NFC");
  const n = src.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  const m = WAKE.exec(n);
  if (!m) return null;
  const cut = m.index + m[0].length;
  let seen = 0, i = 0;
  while (i < src.length && seen < cut) {
    seen += src[i].normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().length || 1;
    i++;
  }
  return src.slice(i).trim();
}
function startListening() { if (!SR || speaking || !wantListen) return; try { rec.start(); } catch {} }
function stopListening() { if (rec) try { rec.abort(); } catch {} }
window.simbaSetListen = on => { wantListen = !!on; if (wantListen) startListening(); else stopListening(); };
if (SR) {
  rec = new SR(); rec.lang = "pt-BR"; rec.continuous = true; rec.interimResults = true;
  rec.onstart = () => {
    if (speaking || document.body.classList.contains("thinking")) return;
    if (!online()) return setState(null, TOKEN ? "reconectando" : "sem código de acesso");
    setState("listening", Date.now() < convoUntil ? "pode falar" : "diga “ei, Simba”"); };
  rec.onresult = e => {
    let interim = "", final = "";
    for (let i = e.resultIndex; i < e.results.length; i++) (e.results[i].isFinal ? (final += e.results[i][0].transcript) : (interim += e.results[i][0].transcript));
    if (interim) $("#heard").textContent = "› " + interim;     // mostra o que o microfone está ouvindo
    if (final) handleUtterance(final.trim());
  };
  rec.onerror = e => { if (e.error === "not-allowed" || e.error === "service-not-allowed") { wantListen = false; showWake(); } };
  rec.onend = () => { if (!speaking && wantListen) setTimeout(startListening, 250); };
}

function dispatch(cmd) {
  if (!cmd) return;
  if (/^(obrigad|valeu|era isso|so isso|pode parar|dispensado)/.test(norm(cmd))) { convoUntil = 0; return say("Às ordens."); }
  sendMessage(cmd, true);
}
function handleUtterance(t) {
  const n = norm(t);
  if (n && n === lastHeard && Date.now() - lastHeardAt < 2000) return;
  lastHeard = n; lastHeardAt = Date.now();
  if (Date.now() < echoUntil && lastSaid && n.length > 10 && norm(lastSaid).includes(n)) return;
  const rest = afterWake(t), woke = rest !== null;
  if (pendingApproval) {
    const tail = woke ? norm(rest) : n;
    if (YES.test(tail)) return answerApproval(true);
    if (NO.test(tail)) return answerApproval(false);
  }
  if (woke) {
    clearTimeout(wakeTimer); wakeTimer = 0;
    if (rest) return dispatch(rest);                 // o que veio depois de "ei, Simba" vai inteiro para a IA
    $("#heard").textContent = "› ei, Simba";
    wakeTimer = setTimeout(() => { wakeTimer = 0; if (!speaking) say("Pois não, senhor?"); }, 1600);
    return;
  }
  if (wakeTimer) { clearTimeout(wakeTimer); wakeTimer = 0; return dispatch(t.trim()); }
  if (Date.now() > convoUntil) return;
  dispatch(t.trim());
}

// ---------- autorizações e avisos ----------
function alertBox(kind, id, label, text, approval) {
  const d = document.createElement("div"); d.className = "alert " + kind; d.id = "al-" + id;
  d.innerHTML = `<span class="label"></span><div class="body"></div>` + (approval ? `<div class="row"><button>SIM</button><button>NÃO</button></div>` : "");
  d.querySelector(".label").textContent = label; d.querySelector(".body").textContent = text;
  if (approval) { const [y, n] = d.querySelectorAll("button"); y.onclick = () => answerApproval(true); n.onclick = () => answerApproval(false); }
  $("#alerts").prepend(d);
  if (!approval) setTimeout(() => d.remove(), 12000);
  if (navigator.vibrate) navigator.vibrate(kind === "info" ? 40 : [60, 60, 60]);
}
function answerApproval(ok) {
  if (!pendingApproval) return;
  send({ type: "approve", id: pendingApproval, ok });
  document.getElementById("al-" + pendingApproval)?.remove();
  pendingApproval = null; document.body.classList.remove("alert");
  say(ok ? "Autorizado." : "Cancelado.");
}

// ---------- conexão com o servidor ----------
let ws, turnText = [], outbox = [], speakTurn = true, reconnectTimer = 0;
function renderRotinas(itens) {
  const el = $("#rotinas");
  if (!el) return;
  el.replaceChildren();
  if (!itens || !itens.length) { el.hidden = true; return; }
  el.hidden = false;
  const titulo = document.createElement("div");
  titulo.className = "label";
  titulo.textContent = "Rotinas";
  el.append(titulo);
  for (const r of itens) {
    const row = document.createElement("div");
    if (!r.ativa) row.className = "off";
    row.textContent = r.horario + "  " + r.nome + (r.ativa ? "" : "  ·  pausada");
    el.append(row);
  }
}
const shown = t => t.replace(/\*\*(.+?)\*\*/g, "$1").replace(/__(.+?)__/g, "$1").replace(/^#{1,6}\s*/gm, "");
function showSaid(t) { const s = $("#said"); s.textContent = t; s.classList.toggle("long", t.length > 160); s.scrollTop = 0; }
const online = () => ws && ws.readyState === 1;
function send(o) { if (online()) ws.send(JSON.stringify(o)); else if (o.type === "message") outbox.push(o); }
function sendMessage(text, voice) {
  silenceNow(); perfReset(); turnOpen = true; voiced = ""; turnText = []; lastSaid = "";
  perfSendAt = performance.now(); perfNetMs = 0; perfMine = true;
  $("#heard").textContent = "› " + text; send({ type: "message", text, voice: !!voice, t: perfSendAt });
  setState("thinking", online() ? "processando" : "sem conexão · envio ao reconectar");
}
function rejectToken() { store.del("st"); TOKEN = ""; outbox = []; showLogin(); setState(null, "código recusado"); }
function connect() {
  if (!TOKEN) return showLogin();
  if (ws) { ws.onmessage = null; try { ws.close(); } catch {} }
  const sock = ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws?token=${T()}&device=${DEVICE}`);
  let opened = false;
  sock.onopen = () => {
    opened = true; loadPanel(); setState(null, "online");
    sock.send(JSON.stringify({ type: "ping", t: performance.now() }));
    for (const o of outbox.splice(0)) { sock.send(JSON.stringify(o)); setState("thinking", "processando"); }
  };
  sock.onclose = async e => {
    if (sock !== ws) return;
    setState(null, "reconectando");
    if (e.code === 4401) return rejectToken();
    // o servidor recusa o código antes de aceitar o WebSocket, então o navegador só vê 1006: confirma por HTTP
    if (!opened) {
      try { const r = await fetch(`/painel?token=${T()}`); if (r.status === 401) return rejectToken(); } catch {}
    }
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connect, 2000);
  };
  ws.onmessage = e => {
    const ev = JSON.parse(e.data);
    switch (ev.type) {
      case "pong":
      case "ack":
        if (typeof ev.t === "number") {
          perfNetMs = performance.now() - ev.t;
          console.info(`[perf] rede ${Math.round(perfNetMs)}ms`);
        }
        break;
      case "status": { const miss = Object.entries(ev.google || {}).filter(([, v]) => !v.ok).map(([c]) => c); setupNotice(miss, ev.telegram); if (ev.rotinas) renderRotinas(ev.rotinas); break; }
      case "rotinas": renderRotinas(ev.itens); break;
      case "user":
        perfReset(); turnOpen = true;
        speakTurn = ev.falar !== false;
        if (ev.device !== DEVICE) { silenceNow(); voiced = ""; lastSaid = ""; }
        turnText = [];
        if (ev.device !== DEVICE) $("#heard").textContent = `› (${ev.device}) ${ev.text.slice(0, 120)}`;
        setState("thinking", ev.device === "proativo" ? "agindo por conta própria" : ev.device === "rotina" ? "rotina" : "processando"); break;
      case "agent": agentState(ev.id, ev.state === "working", ev.task); break;
      case "tool": $("#stateTxt").textContent = ev.name.replace(/_/g, " "); break;
      case "text": perfSawText(); absorbText(ev.text); showSaid(turnText.map(shown).join("\n\n")); if (turnOpen && speakTurn) speakNew(false); break;
      case "done": {
        if (perfMine && typeof ev.model_s === "number") {
          console.info(`[perf] modelo ${ev.model_s}s` + (ev.first_s != null ? ` primeiro ${ev.first_s}s` : ""));
        }
        perfMine = false;
        turnOpen = false; if (speakTurn) speakNew(true); turnText = []; voiced = "";
        document.querySelectorAll(".ag.on").forEach(d => agentState(d.id.slice(3), false));
        if (!sayBusy && !sayQueue.length) doneSpeaking();
        loadPanel(); break;
      }
      case "approval": pendingApproval = ev.id; document.body.classList.add("alert");
        alertBox("", ev.id, "Autorização · diga sim ou não", ev.prompt, true);
        say("Senhor, preciso da sua autorização. " + ev.prompt.split("\n")[0] + ". Posso seguir?"); break;
      case "approval_closed": document.getElementById("al-" + ev.id)?.remove();
        if (pendingApproval === ev.id) { pendingApproval = null; document.body.classList.remove("alert"); } break;
      case "suggestion": alertBox("info", ev.id, ev.auto ? "Iniciativa" : "Sugestão", `${ev.titulo}. ${ev.motivo || ""}`, false);
        say(`Senhor, ${ev.titulo}. ${ev.auto ? "Já estou cuidando disso." : ""}`); break;
      case "reminder": alertBox("info", "r" + ev.id + "-" + Date.now(), "Lembrete", ev.motivo, false); say("Lembrete: " + ev.motivo); break;
      case "error": turnOpen = false; setState(null, "falha: " + ev.text.slice(0, 50)); if (!sayBusy && !sayQueue.length) doneSpeaking(); break;
    }
  };
}

// ---------- texto (reserva) ----------
$("#input").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.value.trim()) { sendMessage(e.target.value.trim()); convoUntil = Date.now() + 15000; e.target.value = ""; }
});

// ---------- ativação (só quando o navegador exige um toque) ----------
function showWake() {
  $("#wakeBody").innerHTML = `<h2 id="wakeTitle">SIMBA</h2><p>Toque em qualquer lugar para ativar a voz.</p>`;
  $("#wake").classList.add("show"); $("#wake").onclick = activate;
}
async function activate() {
  unlockAudio();
  $("#wake").classList.remove("show"); $("#wake").onclick = null; wantListen = true;
  try { const s = await navigator.mediaDevices.getUserMedia({ audio: true }); s.getTracks().forEach(t => t.stop()); } catch {}
  try { await setupPush(); } catch {}
  try { await navigator.wakeLock?.request("screen"); } catch {}
  store.set("activated", "1"); startListening();
  say("Sistemas online. Às suas ordens, senhor.");
}
function showLogin() {
  $("#wakeBody").innerHTML = `<form id="login"><h2 id="wakeTitle">SIMBA</h2><label for="tk" class="label">Código de acesso</label><input id="tk" type="password" autocomplete="current-password" required><button>ATIVAR</button></form>`;
  $("#wake").classList.add("show"); $("#wake").onclick = null;
  $("#login").onsubmit = e => { e.preventDefault(); TOKEN = $("#tk").value.trim(); store.set("st", TOKEN); connect(); activate(); };
}
let tgShown = "";
function setupNotice(miss, tg) {
  document.getElementById("al-google")?.remove();
  if (miss.length) {
    const d = document.createElement("div"); d.className = "alert info"; d.id = "al-google";
    d.innerHTML = `<span class="label">Configuração única</span><div class="body">Conecte as contas Google (só uma vez):</div><div class="row"></div>`;
    for (const c of miss) { const b = document.createElement("button"); b.textContent = c.toUpperCase();
      b.onclick = () => location.href = `/google/connect?conta=${c}&token=${T()}`; d.querySelector(".row").append(b); }
    $("#alerts").append(d);
  }
  const tgKey = !tg || tg.ok ? "" : (tg.configured ? "code:" + (tg.username || "") : "token");
  if (tgKey === tgShown && (tgKey === "" || document.getElementById("al-telegram"))) return;
  tgShown = tgKey;
  document.getElementById("al-telegram")?.remove();
  if (!tgKey) return;
  const d = document.createElement("div"); d.className = "alert info"; d.id = "al-telegram";
  const label = document.createElement("span"); label.className = "label"; label.textContent = "Telegram";
  const body = document.createElement("div"); body.className = "body";
  const row = document.createElement("div"); row.className = "row";
  const input = document.createElement("input");
  const btn = document.createElement("button");
  if (!tg.configured) {
    body.textContent = "No @BotFather, envie /newbot e cole aqui o token.";
    input.type = "password"; input.autocomplete = "off"; input.placeholder = "token do bot";
    btn.textContent = "SALVAR";
    btn.onclick = async () => {
      btn.disabled = true;
      const r = await fetch(`/telegram/token?token=${T()}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ bot_token: input.value.trim() }) });
      const data = await r.json().catch(() => ({}));
      btn.disabled = false;
      if (!r.ok) { body.textContent = data.detail || "não aceito"; return; }
      body.textContent = "Token aceito. Abra o bot e toque em Iniciar.";
    };
  } else {
    body.textContent = `Abra ${tg.username ? "@" + tg.username : "o bot"} no Telegram, toque em Iniciar e digite o código.`;
    input.inputMode = "numeric"; input.maxLength = 8; input.placeholder = "000000"; input.autocomplete = "one-time-code";
    btn.textContent = "LIGAR";
    btn.onclick = async () => {
      btn.disabled = true;
      const r = await fetch(`/telegram/confirm?token=${T()}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ codigo: input.value.trim() }) });
      const data = await r.json().catch(() => ({}));
      btn.disabled = false;
      if (!r.ok) body.textContent = data.detail || "código não aceito";
    };
  }
  row.append(input, btn); d.append(label, body, row); $("#alerts").append(d);
}

// ---------- notificações push ----------
async function setupPush() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !TOKEN) return;
  const reg = await navigator.serviceWorker.register("sw.js");
  if (Notification.permission === "default") await Notification.requestPermission();
  if (Notification.permission !== "granted") return;
  const { key } = await (await fetch(`/push/key?token=${T()}`)).json();
  const raw = atob((key + "=".repeat((4 - key.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/"));
  const sub = (await reg.pushManager.getSubscription()) ||
    await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: Uint8Array.from(raw, c => c.charCodeAt(0)) });
  await fetch(`/push/subscribe?token=${T()}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(sub) });
}

// ---------- início: tenta ativar tudo sozinho; se o navegador bloquear, pede um toque ----------
connect(); if (TOKEN) loadPanel();
if (googleMsg) $("#heard").textContent = "Google: " + googleMsg;
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
if (TOKEN) {
  if (store.get("activated") && SR) { startListening(); navigator.wakeLock?.request("screen").catch(() => {}); setupPush().catch(() => {}); }
  else showWake();
}
function ensureLink() {
  if (!TOKEN) return;
  if (ws && ws.readyState === WebSocket.CONNECTING) return;
  if (online()) return;
  clearTimeout(reconnectTimer);
  reconnectTimer = setTimeout(connect, 400);
}
function relinkAfterWake() {
  if (!TOKEN) return;
  if (ws && ws.readyState === WebSocket.OPEN) { try { ws.close(); } catch {} return; }
  ensureLink();
}
window.addEventListener("online", relinkAfterWake);
document.addEventListener("resume", relinkAfterWake);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    navigator.wakeLock?.request("screen").catch(() => {});
    ensureLink();
    startListening();
    loadPanel();
  }
});
</script>
