<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#041428">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<title>SIMBA</title>
<style>
:root{
  --bg:#041428; --holo:#5ee7ff; --holo-2:#1fb6ff; --holo-dim:rgba(94,231,255,.35); --holo-faint:rgba(94,231,255,.12);
  --text:#d8f6ff; --muted:#7fb3c7; --amber:#ffb547; --ok:#3dffa8; --bad:#ff5d6c;
  --glow:0 0 6px rgba(94,231,255,.8),0 0 18px rgba(31,182,255,.45);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.45 Rajdhani,system-ui,sans-serif;overflow:hidden;
  display:flex;flex-direction:column;height:100dvh;
  background-image:radial-gradient(ellipse at 50% 38%,rgba(16,72,140,.55),transparent 58%),
  radial-gradient(ellipse at 50% 72%,rgba(6,28,70,.8),transparent 42%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
.label{font-family:Orbitron,sans-serif;letter-spacing:.18em;text-transform:uppercase;font-size:10px;color:var(--muted)}

#stage{flex:1;position:relative;min-height:0}
#core{position:absolute;inset:0;width:100%;height:100%;display:block}
#state{position:absolute;left:0;right:0;bottom:10px;text-align:center}
#state .label{color:var(--holo)}
body.interview #state .label{color:var(--amber)}

#caption{padding:4px 18px 2px;text-align:center}
#heard{color:var(--muted);font-size:15px;min-height:20px}
#said{max-height:min(28vh,11rem);overflow:auto;white-space:pre-wrap;font-size:16px;padding:2px 6px 6px}
#said:empty{display:none}

#alerts{position:fixed;top:max(10px,env(safe-area-inset-top));left:12px;width:min(300px,calc(100vw - 24px));z-index:4;display:flex;flex-direction:column;gap:6px}
.alert{border:1px solid var(--amber);background:rgba(40,26,4,.75);padding:8px 10px;color:#ffe2b0;font-size:15px;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.alert.info{border-color:var(--holo);background:rgba(4,26,40,.75);color:var(--text)}
.alert .label{color:var(--amber);display:block;margin-bottom:2px}
.alert.info .label{color:var(--holo)}
.alert .body{white-space:pre-wrap;max-height:110px;overflow:auto}
.alert .row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.alert button{font:600 14px Rajdhani,sans-serif;letter-spacing:.08em;background:transparent;border:1px solid currentColor;color:inherit;padding:6px 12px;min-height:36px}
.alert input{flex:1;min-width:0;background:rgba(4,20,32,.7);border:1px solid var(--holo-dim);color:var(--text);font:16px Rajdhani,sans-serif;padding:8px}

#grid{display:none}
.ag{border:1px solid var(--holo-faint);background:rgba(4,18,30,.5);padding:6px 5px 5px;text-align:center;transition:all .25s;
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.ag .n{font-family:Orbitron,sans-serif;font-size:9px;letter-spacing:.06em;text-transform:uppercase;line-height:1.3;min-height:24px;display:grid;place-items:center}
.ag .s{font-size:9px;letter-spacing:.14em;color:var(--ok);font-family:Orbitron,sans-serif;text-transform:uppercase}
.ag .s::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;margin-right:4px;vertical-align:middle;box-shadow:0 0 6px currentColor}
.ag.on{border-color:var(--holo);background:rgba(31,182,255,.18);box-shadow:inset 0 0 14px rgba(94,231,255,.4)}
.ag.on .s{color:var(--amber)}
.ag.custom{border-style:dashed}
.sep{grid-column:1/-1;margin-top:4px}

footer{display:flex;gap:8px;padding:8px 12px;padding-bottom:max(8px,env(safe-area-inset-bottom));border-top:1px solid var(--holo-faint);background:rgba(1,8,16,.85)}
#input{flex:1;background:rgba(4,20,32,.7);border:1px solid var(--holo-dim);color:var(--text);font:17px Rajdhani,sans-serif;padding:10px 12px;outline:none}
#input:focus{border-color:var(--holo);box-shadow:var(--glow)}
#input::placeholder{color:var(--muted)}

#wake{position:fixed;inset:0;display:none;place-items:center;background:rgba(1,6,13,.9);z-index:5;text-align:center;padding:24px}
#wake.show{display:grid}
#wake p{max-width:300px;color:var(--muted);margin:0 auto}
#wake h2{font-family:Orbitron,sans-serif;letter-spacing:.3em;color:var(--holo);text-shadow:var(--glow);font-weight:500}
#login{display:flex;flex-direction:column;gap:10px;width:min(320px,90vw)}
#login input{background:rgba(4,20,32,.7);border:1px solid var(--holo-dim);color:var(--text);font:17px Rajdhani,sans-serif;padding:12px}
#login button{font:600 14px Orbitron,sans-serif;letter-spacing:.2em;background:rgba(31,182,255,.15);border:1px solid var(--holo);color:var(--holo);padding:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--holo);outline-offset:2px}
</style>
</head>
<body>
<h1 class="sr">SIMBA, assistente pessoal</h1>
<section id="stage">
  <canvas id="core" aria-hidden="true"></canvas>
  <div id="state"><span class="label" id="stateTxt">iniciando</span></div>
</section>

<div id="caption" aria-live="polite">
  <div id="heard"></div>
  <div id="said"></div>
</div>
<div id="alerts" aria-live="assertive"></div>
<div id="grid" aria-label="Agentes"></div>

<footer>
  <label class="sr" for="input">Digite quando não puder falar</label>
  <input id="input" autocomplete="off" enterkeyhint="send" placeholder="Diga “ei, Simba” ou digite aqui">
</footer>

<div id="wake" role="dialog" aria-modal="true" aria-labelledby="wakeTitle"><div id="wakeBody"></div></div>

<script>
const $ = s => document.querySelector(s);
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
const store = { get: k => { try { return localStorage.getItem(k) } catch { return null } },
                set: (k, v) => { try { localStorage.setItem(k, v) } catch {} },
                del: k => { try { localStorage.removeItem(k) } catch {} } };

// ---------- token e parâmetros ----------
const qs = new URLSearchParams(location.search);
if (qs.get("token")) store.set("st", qs.get("token"));
const googleMsg = qs.get("google");
if (location.search) history.replaceState(null, "", location.pathname);
let TOKEN = store.get("st") || "";
const DEVICE = /Android|iPhone|iPad/i.test(navigator.userAgent) ? "celular" : "pc";
const T = () => encodeURIComponent(TOKEN);

// ---------- globo: silêncio = esfera azul estável; falando = malha orgânica azul-violeta com arco de luz ----------
const globe = $("#core"), gctx = globe.getContext("2d");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const LAT = 32, LON = 60;
const MOTES = Array.from({ length: 46 }, () => ({ x: Math.random() * 2 - 1, v: 0.08 + Math.random() * 0.16, p: Math.random(), s: 0.6 + Math.random() * 1.4 }));
// ondas em 3D (direção, frequência, velocidade, fase, peso): deformação suave, sem costura nos polos
const WAVES = [
  [0.62, 0.55, 0.56, 3.4, 0.9, 0.0, 0.2], [-0.71, 0.31, 0.63, 4.6, -1.2, 1.7, 0.17],
  [0.18, -0.93, 0.32, 5.3, 1.4, 3.1, 0.15], [-0.4, -0.52, -0.75, 7.1, -1.7, 0.6, 0.13],
  [0.88, -0.2, -0.43, 8.6, 2.1, 2.4, 0.12], [-0.1, 0.8, -0.59, 10.2, -2.4, 4.2, 0.1],
  [0.5, -0.7, 0.5, 12.4, 2.5, 0.3, 0.08], [0.35, 0.35, -0.87, 14.1, 2.8, 1.1, 0.06],
  [-0.8, -0.5, 0.33, 16.3, -3.1, 5.0, 0.05]];
const SILENT = [150, 220, 255];
const BANDS = [[90, 175, 255], [115, 135, 255], [155, 100, 255], [205, 85, 245], [255, 80, 215]];
const lerp3 = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${Math.max(0, Math.min(1, a)).toFixed(3)})`;
let yaw = 0, voiceLevel = 0, audioCtx, analyser, mediaSrc, voiceBins;
let talk = 0, phase = 0, lastFrame = 0, hudGain = 1;
function resizeGlobe() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const w = globe.clientWidth, h = globe.clientHeight;
  if (!w || !h) return;
  globe.width = Math.round(w * dpr); globe.height = Math.round(h * dpr);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function ensureVoiceTap() {
  // Não ligar o player no AudioContext: o elemento já sai nos alto-falantes, e o grafo repetia a mesma voz.
}
function sampleVoice(speaking, t) {
  if (!speaking || reduceMotion) return voiceLevel * 0.8;
  if (analyser && voiceBins && player.src && !player.paused) {
    analyser.getByteTimeDomainData(voiceBins);
    let s = 0;
    for (let i = 0; i < voiceBins.length; i++) { const n = (voiceBins[i] - 128) / 128; s += n * n; }
    const rms = Math.min(1, Math.sqrt(s / voiceBins.length) * 3.4);
    return voiceLevel * 0.5 + rms * 0.5;
  }
  const env = 0.28 + 0.72 * Math.abs(Math.sin(t * 7.2)) * (0.5 + 0.5 * Math.abs(Math.sin(t * 13.1)));
  return voiceLevel * 0.35 + env * 0.65;
}
function project(x, y, z, cx, cy, scale, pitch) {
  const x1 = x * Math.cos(yaw) + z * Math.sin(yaw);
  const z1 = -x * Math.sin(yaw) + z * Math.cos(yaw);
  const y2 = y * Math.cos(pitch) - z1 * Math.sin(pitch);
  const z2 = y * Math.sin(pitch) + z1 * Math.cos(pitch);
  const p = 2.6 / (2.6 + z2);
  return [cx + x1 * scale * p, cy + y2 * scale * p, z2, x1];
}
function blob(x, y, z, ph) {
  let s = 0;
  for (const [a, b, c, f, v, o, k] of WAVES) s += k * Math.sin(f * (a * x + b * y + c * z) + v * ph + o);
  return s;
}
function spherePoint(lat, lon, amp, ph) {
  const th = lat * Math.PI / LAT, lo = lon * 2 * Math.PI / LON;
  const x = Math.sin(th) * Math.cos(lo), y = Math.cos(th), z = Math.sin(th) * Math.sin(lo);
  const r = amp ? 1 + amp * blob(x, y, z, ph) : 1;
  return [x * r, y * r, z * r];
}
// ---------- HUD do chão: faixas com espessura, blocos, profundidade, mesa, reflexo e ondas da voz ----------
const seeded = (s => () => (s = (s * 16807) % 2147483647) / 2147483647)(20260930);
const OUTER_BLOCKS = (() => {
  const out = []; let a = 0;
  while (a < Math.PI * 2 - 0.05) {
    const len = 0.05 + seeded() * 0.32;
    out.push([a, Math.min(a + len, Math.PI * 2 - 0.02), seeded() < 0.3]);
    a += len + 0.025 + seeded() * 0.06;
  }
  return out;
})();
const ripples = [];
let lastRipple = 0, flick = 1, glitchAt = 0, glitchUntil = 0;
function band(cx, cy, rx, ry, k0, k1, a0 = 0, a1 = Math.PI * 2) {
  gctx.beginPath();
  gctx.ellipse(cx, cy, rx * k1, ry * k1, 0, a0, a1);
  gctx.ellipse(cx, cy, rx * k0, ry * k0, 0, a1, a0, true);
  gctx.closePath();
  gctx.fill();
}
function edge(cx, cy, rx, ry, k, width, a0 = 0, a1 = Math.PI * 2) {
  gctx.beginPath();
  gctx.ellipse(cx, cy, rx * k, ry * k, 0, a0, a1);
  gctx.lineWidth = width;
  gctx.stroke();
}
function drawTable(cx, baseY, rx, ry, w, h, t) {
  const top = baseY - ry * 1.9;
  const desk = gctx.createLinearGradient(0, top, 0, h);
  desk.addColorStop(0, "rgba(3,12,28,0)");
  desk.addColorStop(0.25, "rgba(3,11,24,.55)");
  desk.addColorStop(1, "rgba(1,5,12,.92)");
  gctx.fillStyle = desk;
  gctx.fillRect(0, top, w, h - top);
  softEllipse(cx, baseY, rx * 2.3, ry * 2.4, rgba(lerp3([60, 160, 255], [120, 90, 255], talk * 0.4), 0.22 * flick));
}
function softEllipse(x, y, rx, ry, color) {
  gctx.save();
  gctx.translate(x, y);
  gctx.scale(1, ry / rx);
  const g = gctx.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, color);
  g.addColorStop(1, "rgba(30,90,200,0)");
  gctx.fillStyle = g;
  gctx.beginPath(); gctx.arc(0, 0, rx, 0, Math.PI * 2); gctx.fill();
  gctx.restore();
}
function drawReflection(cx, baseY, cy, scale) {
  const R = scale * 1.05;
  softEllipse(cx, baseY + (baseY - cy) * 0.42, R, R * 0.3, rgba(lerp3([90, 180, 255], [170, 90, 255], talk), 0.16 * flick));
}
function floorLayer(cx, baseY, rx, ry, t, front) {
  const spin = reduceMotion ? 0 : t * 0.11, depth = (front ? 1 : 0.5) * flick;
  gctx.save();
  gctx.beginPath();
  if (front) gctx.rect(0, baseY, globe.clientWidth, globe.clientHeight - baseY);
  else gctx.rect(0, 0, globe.clientWidth, baseY);
  gctx.clip();
  const fill = gctx.createLinearGradient(0, baseY - ry, 0, baseY + ry);
  fill.addColorStop(0, "rgba(70,160,255,.45)");
  fill.addColorStop(1, "rgba(170,228,255,1)");
  gctx.fillStyle = fill;
  gctx.strokeStyle = "rgba(200,240,255,1)";
  const A = (a) => { gctx.globalAlpha = Math.min(1, a * depth * hudGain); };
  A(0.22); edge(cx, baseY, rx, ry, 1.07, 1);
  A(0.5); band(cx, baseY, rx, ry, 0.985, 1.005);
  for (const [a0, a1, hot] of OUTER_BLOCKS) { A(hot ? 0.95 : 0.55); band(cx, baseY, rx, ry, 0.86, 0.945, a0 + spin, a1 + spin); }
  A(0.35); edge(cx, baseY, rx, ry, 0.83, 1);
  A(0.85); band(cx, baseY, rx, ry, 0.72, 0.765);
  for (let i = 0; i < 64; i++) {
    const a0 = -spin * 1.5 + i * Math.PI * 2 / 64;
    A(i % 8 === 0 ? 0.9 : 0.45); band(cx, baseY, rx, ry, 0.6, 0.66, a0, a0 + Math.PI * 2 / 64 * 0.55);
  }
  A(0.7); band(cx, baseY, rx, ry, 0.47, 0.495);
  for (let i = 0; i < 3; i++) {
    const a0 = spin * 2.4 + i * Math.PI * 2 / 3;
    A(0.6); band(cx, baseY, rx, ry, 0.36, 0.39, a0, a0 + 1.5);
  }
  A(0.9); band(cx, baseY, rx, ry, 0.2, 0.235);
  gctx.lineWidth = 1;
  for (let i = 0; i < 120; i++) {
    const a = (i / 120) * Math.PI * 2 + spin * 0.4, major = i % 15 === 0;
    A(major ? 0.95 : 0.3);
    gctx.lineWidth = major ? 2 : 1;
    gctx.beginPath();
    gctx.moveTo(cx + Math.cos(a) * rx * (major ? 1.0 : 1.02), baseY + Math.sin(a) * ry * (major ? 1.0 : 1.02));
    gctx.lineTo(cx + Math.cos(a) * rx * 1.06, baseY + Math.sin(a) * ry * 1.06);
    gctx.stroke();
  }
  if (front) { A(0.9); edge(cx, baseY, rx, ry, 1.005, 1.4, 0.15, Math.PI - 0.15); }
  const now = t;
  for (const r of ripples) {
    const age = (now - r) / 1.3;
    if (age < 0 || age > 1) continue;
    gctx.globalAlpha = (1 - age) * (1 - age) * talk * depth;
    gctx.strokeStyle = rgba(lerp3([120, 210, 255], [180, 110, 255], age), 1);
    edge(cx, baseY, rx, ry, 0.22 + age * 0.95, 2.2 - age * 1.4);
  }
  gctx.globalAlpha = depth;
  const core = gctx.createRadialGradient(cx, baseY, 0, cx, baseY, rx * 0.19);
  core.addColorStop(0, "rgba(225,247,255,.9)");
  core.addColorStop(0.55, "rgba(90,180,255,.35)");
  core.addColorStop(1, "rgba(40,120,255,0)");
  gctx.fillStyle = core;
  gctx.beginPath(); gctx.ellipse(cx, baseY, rx * 0.19, ry * 0.19, 0, 0, Math.PI * 2); gctx.fill();
  gctx.restore();
}
function drawBeam(cx, baseY, cy, scale, floorRx, t) {
  const top = cy + scale * 0.7, bottom = baseY;
  const topW = scale * 0.5, botW = floorRx * 0.2;
  for (const k of [1, 0.72, 0.46, 0.24]) {
    const beam = gctx.createLinearGradient(cx, top, cx, bottom);
    beam.addColorStop(0, "rgba(120,200,255,0)");
    beam.addColorStop(1, "rgba(90,190,255,.075)");
    gctx.fillStyle = beam;
    gctx.beginPath();
    gctx.moveTo(cx - topW * k, top); gctx.lineTo(cx + topW * k, top);
    gctx.lineTo(cx + botW * k, bottom); gctx.lineTo(cx - botW * k, bottom);
    gctx.closePath(); gctx.fill();
  }
  if (reduceMotion) return;
  for (const m of MOTES) {
    const k = (m.p + t * m.v) % 1;
    const y = bottom - (bottom - top) * k;
    const x = cx + m.x * (botW + (topW - botW) * k) * 0.9;
    gctx.fillStyle = `rgba(190,235,255,${(Math.sin(k * Math.PI) * 0.7).toFixed(3)})`;
    gctx.beginPath(); gctx.arc(x, y, m.s, 0, Math.PI * 2); gctx.fill();
  }
}
function drawArc(cx, cy, R, t, level) {
  const ar = R * (1.28 + 0.035 * level), sway = reduceMotion ? 0 : Math.sin(t * 0.45) * 0.22;
  gctx.save();
  gctx.translate(cx, cy);
  gctx.rotate(-0.22 + sway);
  const grad = gctx.createLinearGradient(-ar, 0, ar, 0);
  grad.addColorStop(0, rgba([70, 200, 255], talk));
  grad.addColorStop(0.5, rgba([150, 115, 255], talk));
  grad.addColorStop(1, rgba([255, 75, 220], talk));
  gctx.strokeStyle = grad;
  gctx.shadowColor = rgba([185, 95, 255], 0.95 * talk);
  gctx.shadowBlur = 24;
  gctx.lineWidth = 2.2 + 2.6 * level;
  gctx.beginPath(); gctx.ellipse(0, 0, ar, ar * 0.97, 0, Math.PI * 0.95, Math.PI * 2.42); gctx.stroke();
  gctx.shadowBlur = 10;
  gctx.lineWidth = 1;
  gctx.beginPath(); gctx.ellipse(0, 0, ar * 1.035, ar * 1.0, 0, Math.PI * 1.25, Math.PI * 1.85); gctx.stroke();
  gctx.beginPath(); gctx.ellipse(0, 0, ar * 0.975, ar * 0.95, 0, Math.PI * 2.05, Math.PI * 2.5); gctx.stroke();
  gctx.restore();
  gctx.shadowBlur = 0;
}
function drawSphere(cx, cy, scale, t) {
  const R = scale * 1.08, level = voiceLevel, amp = talk * (0.12 + 0.12 * level), calm = 1 - talk;
  const halo = gctx.createRadialGradient(cx, cy, R * 0.6, cx, cy, R * 1.85);
  halo.addColorStop(0, rgba(lerp3([70, 170, 255], [150, 80, 255], talk), 0.35 + 0.18 * talk * level));
  halo.addColorStop(1, "rgba(60,120,255,0)");
  gctx.fillStyle = halo;
  gctx.beginPath(); gctx.arc(cx, cy, R * 1.85, 0, Math.PI * 2); gctx.fill();
  if (calm > 0.01) {
    const body = gctx.createRadialGradient(cx - R * 0.25, cy - R * 0.3, R * 0.05, cx, cy, R);
    body.addColorStop(0, rgba([90, 180, 255], 0.2 * calm));
    body.addColorStop(0.65, rgba([30, 110, 220], 0.16 * calm));
    body.addColorStop(0.92, rgba([80, 180, 255], 0.34 * calm));
    body.addColorStop(1, rgba([170, 230, 255], 0.55 * calm));
    gctx.fillStyle = body;
    gctx.beginPath(); gctx.arc(cx, cy, R, 0, Math.PI * 2); gctx.fill();
  }
  if (talk > 0.01) {
    const core = gctx.createRadialGradient(cx, cy, 0, cx, cy, R * (1 + amp));
    core.addColorStop(0, rgba([110, 70, 230], 0.22 * talk));
    core.addColorStop(0.75, rgba([140, 70, 240], 0.16 * talk));
    core.addColorStop(1, rgba([220, 80, 255], 0));
    gctx.fillStyle = core;
    gctx.beginPath(); gctx.arc(cx, cy, R * (1 + amp), 0, Math.PI * 2); gctx.fill();
  }
  const pts = [];
  for (let lat = 0; lat <= LAT; lat++) {
    const row = [];
    for (let lon = 0; lon < LON; lon++) row.push(project(...spherePoint(lat, lon, amp, phase), cx, cy, scale, 0.2));
    pts.push(row);
  }
  const N = 4, C = BANDS.length, paths = Array.from({ length: N * C }, () => new Path2D());

  if (!interviewMode && /^(obrigad|valeu|era isso|so isso|pode parar|dispensado)/.test(norm(cmd))) { convoUntil = 0; return say("Às ordens."); }

    clearTimeout(wakeTimer); wakeTimer = 0;
    if (rest) return dispatch(rest);                 // o que veio depois de "ei, Simba" vai inteiro para a IA
    $("#heard").textContent = "› ei, Simba";

}
function rejectToken() { store.del("st"); TOKEN = ""; outbox = []; showLogin(); setState(null, "código recusado"); }
function connect() {
  if (!TOKEN) return showLogin();
  if (ws) { ws.onmessage = null; try { ws.close(); } catch {} }
  const sock = ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws?token=${T()}&device=${DEVICE}`);
  let opened = false;
  sock.onopen = () => {
    opened = true; loadPanel(); setState(null, "online");
    for (const o of outbox.splice(0)) { sock.send(JSON.stringify(o)); setState("thinking", "processando"); }
  };
  sock.onclose = async e => {
    if (sock !== ws) return;
    setState(null, "reconectando");
    if (e.code === 4401) return rejectToken();
    // o servidor recusa o código antes de aceitar o WebSocket, então o navegador só vê 1006: confirma por HTTP
    if (!opened) {
      try { const r = await fetch(`/painel?token=${T()}`); if (r.status === 401) return rejectToken(); } catch {}
    }
    setTimeout(connect, 2000);
  };
  ws.onmessage = e => {
    const ev = JSON.parse(e.data);
    switch (ev.type) {
      case "status": {
        const miss = Object.entries(ev.google || {}).filter(([, v]) => !v.ok).map(([c]) => c); setupNotice(miss, ev.telegram);
        if (typeof ev.interview === "boolean") setInterview(ev.interview); break; }
      case "interview": setInterview(!!ev.on); break;
      case "user":
        turnOpen = true;
        if (ev.device !== DEVICE) { silenceNow(); voiced = ""; lastSaid = ""; }
        turnText = [];
        if (ev.device !== DEVICE) $("#heard").textContent = `› (${ev.device}) ${ev.text.slice(0, 120)}`;
        setState("thinking", ev.device === "proativo" ? "agindo por conta própria" : ev.device === "rotina" ? "rotina" : "processando"); break;
      case "agent": agentState(ev.id, ev.state === "working", ev.task); break;
      case "tool": $("#stateTxt").textContent = (interviewMode ? "entrevista · " : "") + ev.name.replace(/_/g, " "); break;
      case "text": absorbText(ev.text); showSaid(turnText.map(shown).join("\n\n")); if (turnOpen) speakNew(false); break;
      case "done": {
        turnOpen = false; speakNew(true); turnText = []; voiced = "";
        document.querySelectorAll(".ag.on").forEach(d => agentState(d.id.slice(3), false));
        if (!sayBusy && !sayQueue.length) doneSpeaking();
        loadPanel(); break;
      }
      case "approval": pendingApproval = ev.id; document.body.classList.add("alert");
        alertBox("", ev.id, "Autorização · diga sim ou não", ev.prompt, true);
        say("Senhor, preciso da sua autorização. " + ev.prompt.split("\n")[0] + ". Posso seguir?"); break;
      case "approval_closed": document.getElementById("al-" + ev.id)?.remove();
        if (pendingApproval === ev.id) { pendingApproval = null; document.body.classList.remove("alert"); } break;
      case "suggestion": alertBox("info", ev.id, ev.auto ? "Iniciativa" : "Sugestão", `${ev.titulo}. ${ev.motivo || ""}`, false);
        say(`Senhor, ${ev.titulo}. ${ev.auto ? "Já estou cuidando disso." : ""}`); break;
      case "reminder": alertBox("info", "r" + ev.id + "-" + Date.now(), "Lembrete", ev.motivo, false); say("Lembrete: " + ev.motivo); break;
      case "error": turnOpen = false; setState(null, "falha: " + ev.text.slice(0, 50)); if (!sayBusy && !sayQueue.length) doneSpeaking(); break;
    }
  };
}

// ---------- texto (reserva) ----------
$("#input").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.value.trim()) { sendMessage(e.target.value.trim()); convoUntil = Date.now() + 15000; e.target.value = ""; }
});

// ---------- ativação (só quando o navegador exige um toque) ----------
function showWake() {
  $("#wakeBody").innerHTML = `<h2 id="wakeTitle">SIMBA</h2><p>Toque em qualquer lugar para ativar a voz.</p>`;
  $("#wake").classList.add("show"); $("#wake").onclick = activate;
}
async function activate() {
  unlockAudio();
  $("#wake").classList.remove("show"); $("#wake").onclick = null; wantListen = true;
  try { const s = await navigator.mediaDevices.getUserMedia({ audio: true }); s.getTracks().forEach(t => t.stop()); } catch {}
  try { await setupPush(); } catch {}
  try { await navigator.wakeLock?.request("screen"); } catch {}
  store.set("activated", "1"); startListening();
  say("Sistemas online. Às suas ordens, senhor.");
}
function showLogin() {
  $("#wakeBody").innerHTML = `<form id="login"><h2 id="wakeTitle">SIMBA</h2><label for="tk" class="label">Código de acesso</label><input id="tk" type="password" autocomplete="current-password" required><button>ATIVAR</button></form>`;
  $("#wake").classList.add("show"); $("#wake").onclick = null;
  $("#login").onsubmit = e => { e.preventDefault(); TOKEN = $("#tk").value.trim(); store.set("st", TOKEN); connect(); activate(); };
}
let tgShown = "";
function setupNotice(miss, tg) {
  document.getElementById("al-google")?.remove();
  if (miss.length) {
    const d = document.createElement("div"); d.className = "alert info"; d.id = "al-google";
    d.innerHTML = `<span class="label">Configuração única</span><div class="body">Conecte as contas Google (só uma vez):</div><div class="row"></div>`;
    for (const c of miss) { const b = document.createElement("button"); b.textContent = c.toUpperCase();
      b.onclick = () => location.href = `/google/connect?conta=${c}&token=${T()}`; d.querySelector(".row").append(b); }
    $("#alerts").append(d);
  }
  const tgKey = !tg || tg.ok ? "" : (tg.configured ? "code:" + (tg.username || "") : "token");
  if (tgKey === tgShown && (tgKey === "" || document.getElementById("al-telegram"))) return;
  tgShown = tgKey;
  document.getElementById("al-telegram")?.remove();
  if (!tgKey) return;
  const d = document.createElement("div"); d.className = "alert info"; d.id = "al-telegram";
  const label = document.createElement("span"); label.className = "label"; label.textContent = "Telegram";
  const body = document.createElement("div"); body.className = "body";
  const row = document.createElement("div"); row.className = "row";
  const input = document.createElement("input");
  const btn = document.createElement("button");
  if (!tg.configured) {
    body.textContent = "No @BotFather, envie /newbot e cole aqui o token.";
    input.type = "password"; input.autocomplete = "off"; input.placeholder = "token do bot";
    btn.textContent = "SALVAR";
    btn.onclick = async () => {
      btn.disabled = true;
      const r = await fetch(`/telegram/token?token=${T()}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ bot_token: input.value.trim() }) });
      const data = await r.json().catch(() => ({}));
      btn.disabled = false;
      if (!r.ok) { body.textContent = data.detail || "não aceito"; return; }
      body.textContent = "Token aceito. Abra o bot e toque em Iniciar.";
    };
  } else {
    body.textContent = `Abra ${tg.username ? "@" + tg.username : "o bot"} no Telegram, toque em Iniciar e digite o código.`;
    input.inputMode = "numeric"; input.maxLength = 8; input.placeholder = "000000"; input.autocomplete = "one-time-code";
    btn.textContent = "LIGAR";
    btn.onclick = async () => {
      btn.disabled = true;
      const r = await fetch(`/telegram/confirm?token=${T()}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ codigo: input.value.trim() }) });
      const data = await r.json().catch(() => ({}));
      btn.disabled = false;
      if (!r.ok) body.textContent = data.detail || "código não aceito";
    };
  }
  row.append(input, btn); d.append(label, body, row); $("#alerts").append(d);
}

// ---------- notificações push ----------
async function setupPush() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !TOKEN) return;
  const reg = await navigator.serviceWorker.register("sw.js");
  if (Notification.permission === "default") await Notification.requestPermission();
  if (Notification.permission !== "granted") return;
  const { key } = await (await fetch(`/push/key?token=${T()}`)).json();
  const raw = atob((key + "=".repeat((4 - key.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/"));
  const sub = (await reg.pushManager.getSubscription()) ||
    await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: Uint8Array.from(raw, c => c.charCodeAt(0)) });
  await fetch(`/push/subscribe?token=${T()}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(sub) });
}

// ---------- início: tenta ativar tudo sozinho; se o navegador bloquear, pede um toque ----------
connect(); if (TOKEN) loadPanel();
if (googleMsg) $("#heard").textContent = "Google: " + googleMsg;
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
if (TOKEN) {
  if (store.get("activated") && SR) { startListening(); navigator.wakeLock?.request("screen").catch(() => {}); setupPush().catch(() => {}); }
  else showWake();
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { navigator.wakeLock?.request("screen").catch(() => {}); startListening(); loadPanel(); }
});
</script>
